name: Generate Short Video

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Тема ролика"
        required: true
        type: string
      voice_profile:
        description: "Голос диктора (auto — выбирает ИИ)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - dark_male
          - calm_male
          - sharp_female
          - emotional_female
          - calm_female

jobs:
  build-video:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install FFmpeg and Cyrillic fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation fonts-dejavu-core

      - name: Cache Silero model
        uses: actions/cache@v4
        with:
          path: assets/models
          key: silero-v4-ru-model

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run Content Factory
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOPIC: ${{ inputs.topic }}
          VOICE_PROFILE: ${{ inputs.voice_profile }}
        run: python cloud_run.py

      - name: Upload backup artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: generated-video
          path: output/**/final.mp4
          retention-days: 3
